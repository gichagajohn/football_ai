name: Football Pulse AI — Daily Ticket
on:
  schedule:
    # 05:00 UTC = 08:00 EAT
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      league_ids:
        description: "Comma-separated API-Football league IDs to test with (leave blank for default top-5 + UCL)"
        required: false
        default: ""
      cleaner_threshold:
        description: "Override CLEANER_THRESHOLD for this run, e.g. 0.3 (leave blank for default 0.5)"
        required: false
        default: ""
jobs:
  daily-prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run daily pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional repository variable for a custom model/fallback order.
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Both blank on the scheduled trigger (github.event.inputs is empty
          # for schedule events), which scout_agent.py / pipeline.py already
          # treat as "use the normal top-5 + UCL default, threshold 0.5".
          # Only a manual "Run workflow" click with these fields filled in
          # will actually override anything.
          LEAGUE_IDS: ${{ github.event.inputs.league_ids }}
          CLEANER_THRESHOLD: ${{ github.event.inputs.cleaner_threshold }}
          # Publish risk-approved selections even when the model edge is up to
          # 10 percentage points below the bookmaker-implied probability.
          # This is intentionally less conservative than the default 0.03.
          MIN_EDGE_MARGIN: "-0.10"
        run: python -m backend.daily_run
