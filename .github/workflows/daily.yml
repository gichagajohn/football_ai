name: Football Pulse AI — Daily Ticket

on:
  schedule:
    # 04:00 UTC = 07:00 EAT
    - cron: "0 4 * * *"

  workflow_dispatch:
    inputs:
      league_ids:
        description: "Comma-separated competition codes (blank = 10 free-plan competitions; optional cups/UEFA require plan access)"
        required: false
        default: ""

      cleaner_threshold:
        description: "Override CLEANER_THRESHOLD for this run, e.g. 0.3 (leave blank for default 0.5)"
        required: false
        default: ""

# Serialize scheduled and manual production runs. A queued rerun starts only
# after the active run has stored its snapshot and finished sending its email.
concurrency:
  group: football-pulse-daily-production
  cancel-in-progress: false

jobs:
  daily-prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}

          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          LEAGUE_IDS: ${{ github.event.inputs.league_ids }}
          CLEANER_THRESHOLD: ${{ github.event.inputs.cleaner_threshold }}

          # Every published selection must have non-negative model EV.
          MIN_EDGE_MARGIN: "0.00"
          MIN_SELECTION_PROBABILITY: "0.50"
          CONFIDENCE_THRESHOLD: "0.60"

          # Singles are valid. Zero disables the old six-leg/20-odds ceilings.
          # Every available fixture is considered; NO BET remains valid.
          MIN_SELECTIONS: "1"
          MAX_SELECTIONS: "0"
          COMBINED_ODDS_MIN: "1.00"
          COMBINED_ODDS_MAX: "0.00"
          SCOUT_HARD_CAP_MATCHES: "0"
          SCOUT_BATCH_SIZE: "12"
          PORTFOLIO_BEAM_WIDTH: "200"
          POISSON_MARKET_WEIGHT: "0.35"
          POISSON_TIME_DECAY_DAYS: "240"
          MIN_TEAM_HISTORY: "8"
          CALIBRATION_MIN_SAMPLES: "200"
          CALIBRATION_HALF_LIFE_DAYS: "240"

          # Bypasses only Auditor/Decision warnings. Hard data, probability,
          # EV, unique-fixture, leg-count and combined-odds gates still apply.
          FORCE_PUBLISH: "true"

        run: python -m backend.daily_run
